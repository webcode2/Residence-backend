# MVP architecture: PostgreSQL directly (no PgBouncer) + remote Upstash Redis.
# Set REDIS_URL to the Upstash rediss:// URL in .env before starting the stack.

services:
  db:
    image: postgres:15-alpine
    container_name: residence_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-residence_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-residence_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: residence_backend
    restart: always
    env_file:
      - .env
    volumes:
      - ./residence-336b6-firebase-adminsdk-fbsvc-6ef51abbb7.json:/app/residence-336b6-firebase-adminsdk-fbsvc-6ef51abbb7.json:ro
    ports:
      - "8000:8000"
    environment:
      - DB_USE_PGBOUNCER=false
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-residence_db}
      - DIRECT_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-residence_db}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set in .env (Upstash rediss:// URL)}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
