# MVP architecture: PostgreSQL directly (no PgBouncer) + remote Upstash Redis.
# REDIS_URL must be the Upstash rediss:// URL, supplied via .env.

services:
  db:
    image: postgres:15-alpine
    container_name: residence_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-residence_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-residence_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - residence_internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-residence_user} -d ${POSTGRES_DB:-residence_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: residence_prod_api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./residence-336b6-firebase-adminsdk-fbsvc-6ef51abbb7.json:/app/residence-336b6-firebase-adminsdk-fbsvc-6ef51abbb7.json:ro
    environment:
      - ENVIRONMENT=production
      - DB_USE_PGBOUNCER=false
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-residence_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-residence_db}
      - DIRECT_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-residence_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-residence_db}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set in .env (Upstash rediss:// URL)}
      - ENABLE_MAINTENANCE_SCHEDULER=false
    ports:
      - "8000:8000"
    networks:
      - residence_internal
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: residence_prod_worker
    restart: unless-stopped
    command: [ "python", "worker.py", "--daemon" ]
    env_file:
      - .env
    volumes:
      - ./residence-336b6-firebase-adminsdk-fbsvc-6ef51abbb7.json:/app/residence-336b6-firebase-adminsdk-fbsvc-6ef51abbb7.json:ro
    environment:
      - ENVIRONMENT=production
      - DB_USE_PGBOUNCER=false
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=2
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-residence_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-residence_db}
      - DIRECT_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-residence_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-residence_db}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set in .env (Upstash rediss:// URL)}
      - SKIP_MIGRATIONS=1
    healthcheck:
      test: [ "CMD", "python3", "-c", "import sys; sys.exit(0)" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - residence_internal
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_prod_data:

networks:
  residence_internal:
    driver: bridge
