# MVP architecture: remote Neon PostgreSQL (DB_URL) + remote Upstash Redis (REDIS_URL).
# No local Postgres, PgBouncer, or Redis containers.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: residence_prod_api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./residence-elastrocloud-firebase-adminsdk-fbsvc.json:/app/residence-elastrocloud-firebase-adminsdk-fbsvc.json:ro
    environment:
      - ENVIRONMENT=production
      - DB_USE_PGBOUNCER=false
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
      - DB_URL=${DB_URL:?DB_URL must be set in .env (Neon postgresql:// URL)}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set in .env (Upstash rediss:// URL)}
      - ENABLE_MAINTENANCE_SCHEDULER=false
      - ENABLE_EMBEDDED_WORKERS=false
    ports:
      - "8000:8000"
    networks:
      - residence_internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: residence_prod_worker
    restart: unless-stopped
    command: [ "python", "worker.py", "--daemon" ]
    env_file:
      - .env
    volumes:
      - ./residence-elastrocloud-firebase-adminsdk-fbsvc.json:/app/residence-elastrocloud-firebase-adminsdk-fbsvc.json:ro
    environment:
      - ENVIRONMENT=production
      - DB_USE_PGBOUNCER=false
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=2
      - DB_URL=${DB_URL:?DB_URL must be set in .env (Neon postgresql:// URL)}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set in .env (Upstash rediss:// URL)}
      - SKIP_MIGRATIONS=1
    healthcheck:
      test: [ "CMD", "python3", "-c", "import sys; sys.exit(0)" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - residence_internal

networks:
  residence_internal:
    driver: bridge
